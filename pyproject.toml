[project]
name = "mapping-benchmark"
version = "0.1.0"
description = "A three-axis benchmark for mapping patient tumours to preclinical models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Ingenix", email = "info@ingenix.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "snakemake>=8.0.0",
    "scanpy>=1.10.0",
    "anndata>=0.10.0",
    "numpy>=1.26.0",
    "pandas[parquet]>=2.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
    "huggingface-hub>=0.20.0",
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.0",
]

[build-system]
requires = ["uv_build>=0.9.12,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
