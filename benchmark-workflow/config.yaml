# Benchmark configuration. Inputs are described in resources/datasets.yaml.

# Models are fitted on these datasets only. Every other dataset is seen at projection
# time, so retrieval into it measures how the embedding generalises to unseen data.
training_datasets: [tcga, depmap]
n_genes: 2000       # shared gene panel: most variable genes within the training datasets
latent_dim: 64      # every method embeds into this many dimensions
random_seed: 42

# Every other method is compared with this one on each pair's score, over the same
# resamples, with Holm's correction within each axis (results/comparisons.csv). 10,000
# resamples let a p-value fall below the strictest Holm threshold, 0.05 / 24 on ontology.
baseline: Corr-hvg

# Axis 1 - ontology. A neighbour is worth the simGIC between its MONDO term and the
# query's; the score is the mean over the k nearest neighbours (simGIC@k).
ontology:
  k: 10
  bootstrap: 10000  # query-cluster resamples for each method's interval and comparison
  pairs:
    tcga_to_depmap:      {query: tcga,      database: depmap}
    metaprism_to_depmap: {query: metaprism, database: depmap}
    tcga_to_metaprism:   {query: tcga,      database: metaprism}
    tcga_to_pdxe:        {query: tcga,      database: pdxe}

# Axis 2 - mutation. Per disease and alteration, AUROC@k of how often mutant and
# wild-type queries retrieve mutant neighbours. Diseases, alterations, pairs and scoring
# settings live in the task file.
mutation:
  tasks: benchmark-workflow/resources/mutation_tasks.yaml

# Axis 3 - donor. A neighbour is worth 1 when it comes from the same patient (precision@k).
donor:
  k: 1
  bootstrap: 10000
  pairs:
    aphrodite: {query: aphrodite_human, database: aphrodite_pdx}

# Methods. `type` selects the training rules; every other key is passed to the method's
# train command as a flag. latent_dim and random_seed above are passed to all of them.
methods:
  PCA:
    type: pca
  scVI:
    type: scvi
    n_layers: 1
    n_hidden: 256
    dropout_rate: 0.0
    gene_likelihood: nb
    max_epochs: 300
    kl_warmup_epochs: 100
  MOBER:
    type: mober
    batch_size: 1600
    epochs: 3000
    val_set_size: 0.1   # patience applies to this validation split
    patience: 100
    kl_weight: 1.0e-5
    src_adv_weight: 0.01

  # Not fitted at all: the 2,000-gene panel in log1p(TPM), row-standardised, so retrieval
  # ranks by correlation (rule embed_correlation). The floor a learned space has to beat.
  Corr-hvg:
    type: correlation
