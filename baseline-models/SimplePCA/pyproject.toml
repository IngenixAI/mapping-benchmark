[project]
name = "simplepca"
version = "0.1.0"
description = "Simple PCA baseline for representation learning benchmark"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.4.0",
    "scanpy>=1.10.0",
    "anndata>=0.10.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "joblib>=1.3.0",
]

[project.scripts]
simplepca-train = "simplepca.scripts.train:main"
simplepca-project = "simplepca.scripts.project:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simplepca"]
