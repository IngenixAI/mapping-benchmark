[project]
name = "mober"
version = "2.0.0"
description = "MOBER: Multi Origin Batch Effect Remover"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "scanpy>=1.10.0",
    "anndata>=0.10.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.12.0",
    "numexpr>=2.8.0",
]

[project.scripts]
mober = "mober.mober:main"
mober-extract-latents = "mober.scripts.extract_latents:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mober"]
