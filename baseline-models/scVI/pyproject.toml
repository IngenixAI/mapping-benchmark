[project]
name = "scvi-baseline"
version = "0.1.0"
description = "scVI baseline for representation learning benchmark"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "scvi-tools>=1.1.0",
    "scanpy>=1.9.0",
    "anndata>=0.10.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "torch>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scvi_baseline"]

[project.scripts]
scvi-train = "scvi_baseline.scripts.train:main"
scvi-project = "scvi_baseline.scripts.project:main"
